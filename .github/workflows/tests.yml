name: C regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizers: ["no", "yes"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - run: autoreconf --install
      - run: mkdir build
      - name: Configure
        working-directory: build
        run: ../configure --disable-doxygen-doc --enable-sanitizers=${{ matrix.sanitizers }}
      - run: make -j2 check
        working-directory: build
      - name: Show failure details
        if: failure()
        run: cat build/tests/test-suite.log
